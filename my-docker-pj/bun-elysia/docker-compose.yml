#  docker-compose -f docker-compose.yml config check validate config
version: "3.8"
services:
  your_server_name:
    build:
      context: ./bunpj
      dockerfile: ../docker/Dockerfile
    image: yourdockeracc/yourbunserver:latest
    command: bun run dev
    working_dir: /app
    # ports:
    # - "3000:3000"
    # expose:
    # - "3000"
    restart: always
    labels:
      com.docker.compose.project: "your_server_name"
      virtual.host: "servicname.local.com"
      virtual.tls-email: your@email.com
      virtual.port: "3000"
    environment:
      TZ: Asia/Bangkok
    volumes:
      - ./bunpj/public:/app/public
      - ./bunpj/src:/app/src
    env_file:
      - ./bunpj/.env.prod
    logging:
      # ใช้ json-file driver (default)
      driver: "json-file"
      options:
        # จำกัดขนาดของแต่ละไฟล์ log ไม่ให้เกิน 10MB
        # เก็บไฟล์ log ไว้สูงสุด 5 ไฟล์
        max-size: "10m"
        max-file: "5"

networks:
  default:
    external: true
    name: proxy-network
