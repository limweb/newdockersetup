services:
  dbx:
    image: t8y2/dbx:latest
    container_name: dbx-web
    restart: unless-stopped
    ports:
      - "4224:4224"  # สามารถเปลี่ยนพอร์ตด้านหน้าได้ตามต้องการ
    environment:
      - DBX_PASSWORD=your_secure_password  # ⚠️ เปลี่ยนรหัสผ่านตรงนี้
    volumes:
      - dbx-data:/app/data

volumes:
  dbx-data:

networks:
  default:
    external: true
    name: proxy-network    